################################### Default Configuration ############################
baseurl = "https://acai.gmbh/"
title = "ACAI Consulting - Cloud Superfood"
theme = "vex-hugo"
# post excert
summarylength = "20"
# google analytics
googleAnalytics = "G-N96HSFBQMH"

# unsafe html
[markup.goldmark.renderer]
unsafe = true

# robots
enableRobotsTXT = true

defaultContentLanguage = "en-us" # Set English as the default language
defaultContentLanguageInSubdir = true

[privacy]
[privacy.disqus]
disable = true

[privacy.googleAnalytics]
anonymizeIP = true
disable = false
respectDoNotTrack = true
useSessionStorage = false

[privacy.instagram]
disable = true
simple = false

[privacy.x]
disable = true
enableDNT = false
simple = false

[privacy.vimeo]
disable = true
enableDNT = false
simple = false

[privacy.youtube]
disable = true
privacyEnhanced = false


