########################### Default parameters ##########################
[params]
favicon = "images/favicon.png"
main_logo = "images/logo/logo_banner.png"
acai_logo_light = "/images/logos/acai_text-light.png"
acai_logo_dark  = "/images/logos/acai_text-dark.png"
linkedinAnalyticsID = "7689050"

# Homepage CTA + form
ctaUrl     = "/booking"
formAction = "https://formspree.io/f/xzdobppj"

# Hero rotating headlines
heroHeadlines = [
  "Your AWS Landing Zone Specialist",
  "We take you to the cloud",
  "Your digitalization superfood",
  "Your ideas — our solutions",
]

# Solution product cards (used by acai-hero shields + acai-solutions grid)
[[params.solutions]]
  id    = "vecto"
  name  = "VECTO"
  color = "#2563EB"
  url   = "/solutions/vecto/"
  desc  = "Automated network connectivity and routing management across your multi-account AWS environment."
  desc_de = "Automatisiertes Netzwerk- und Routing-Management über Ihre AWS-Multi-Account-Umgebung."
[[params.solutions]]
  id    = "acf"
  name  = "ACF"
  color = "#6B21A8"
  url   = "/solutions/acf/"
  desc  = "AWS Control Framework — governance and policy management for enterprise Landing Zones."
  desc_de = "AWS Control Framework — Governance und Policy-Management für Enterprise Landing Zones."
[[params.solutions]]
  id    = "provisio"
  name  = "PROVISIO"
  color = "#B45309"
  url   = "/solutions/provisio/"
  desc  = "Self-service account vending with template-based provisioning and approval workflows."
  desc_de = "Self-Service-Account-Vending mit vorlagenbasierter Bereitstellung und Genehmigungs-Workflows."
[[params.solutions]]
  id    = "semper"
  name  = "SEMPER"
  color = "#0F766E"
  url   = "/solutions/semper/"
  desc  = "Continuous compliance and drift detection with automated remediation capabilities."
  desc_de = "Kontinuierliche Compliance und Drift-Erkennung mit automatisierter Behebung."

# Meta data
description = "Consulting, engineering, and solutions centered on automation, security, and governance within expansive AWS ecosystems."
copyright = "Copyright © 2018 - 2026 ACAI GmbH"
author = "ACAI GmbH"

[taxonomies]
tag = "tags"

# Preloader
[params.preloader]
enable = false
preloader = "" # use .png , .svg or .gif format

[params.menu.main]
visible = true

